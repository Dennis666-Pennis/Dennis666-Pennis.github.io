<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千万别乱按</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            min-height: 100vh;
            font-family: 微软雅黑;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 80px;
            letter-spacing: 2px;
            font-size:26px;
            transition: all 0.3s;
        }
        .main-btn{
            background:#d4af37;
            border:none;
            padding:20px 80px;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .main-btn:hover{
            background: #b9962c;
            transform: scale(1.05);
        }
        .scary-pop{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: all 0.18s ease-out;
        }
        .scary-pop.active{
            opacity: 1;
            transform: scale(1);
        }
        .scary-img{
            max-width: 90vw;
            max-height: 90vh;
            border-radius:8px;
        }
        @keyframes flash {
            0% {background:#000;}
            50% {background:#ff0000;}
            100% {background:#000;}
        }
        .flash-on{
            animation: flash 0.05s infinite alternate;
        }
    </style>
</head>
<body>
    <h1>没事不要乱点</h1>
    <button class="main-btn">请按</button>

    <div class="scary-pop">
        <img class="scary-img" src="scary.jpg">
    </div>

    <script>
        const btn = document.querySelector('.main-btn')
        const titleText = document.querySelector('h1')
        const pop = document.querySelector('.scary-pop')
        let clickCount = 0;

        const scarySound = new Audio('https://www.myinstants.com/media/sounds/minecraft-jumpscare.mp3')
        scarySound.preload = 'auto'
        scarySound.volume = 1

        btn.addEventListener('click',function(){
            clickCount ++;
            // 分段文字提示
            if(clickCount === 1){
                titleText.innerText = "我劝你不要再继续";
            }
            else if(clickCount === 2){
                titleText.innerText = "明知危险还要执意触碰";
            }
            else if(clickCount >= 3){
                // 第三次点击直接触发全部惊吓效果
                pop.style.display = 'flex'
                void pop.offsetWidth
                pop.classList.add('active')
                pop.classList.add('flash-on')
                scarySound.currentTime = 0
                scarySound.play()
            }
        })

        pop.onclick = ()=>{
            pop.classList.remove('active')
            pop.classList.remove('flash-on')
            setTimeout(()=>{
                pop.style.display = 'none'
            },180)
        }
    </script>
</body>
</html>

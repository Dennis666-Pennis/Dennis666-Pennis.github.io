<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千万别乱按</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            min-height: 100vh;
            font-family: 微软雅黑;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 80px;
            letter-spacing: 2px;
        }
        .main-btn{
            background:#d4af37;
            border:none;
            padding:20px 80px;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .main-btn:hover{
            background: #b9962c;
            transform: scale(1.05);
        }
        .scary-pop{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            /* 初始状态：极小+完全透明 */
            opacity: 0;
            transform: scale(0);
            /* 平滑放大过渡 */
            transition: all 0.3s ease-out;
        }
        /* 弹窗激活状态：完全放大+显示 */
        .scary-pop.active{
            opacity: 1;
            transform: scale(1);
        }
        .scary-img{
            max-width: 90vw;
            max-height: 90vh;
            border-radius:8px;
        }
        /* 全屏惊吓闪烁动画 */
        @keyframes flash {
            0% {background:#000;}
            50% {background:#ff0000;}
            100% {background:#000;}
        }
        .flash-on{
            animation: flash 0.08s infinite alternate;
        }
    </style>
</head>
<body>
    <h1>没事不要乱点</h1>
    <button class="main-btn">请按</button>

    <div class="scary-pop">
        <img class="scary-img" src="scary.jpg">
    </div>

    <script>
        const btn = document.querySelector('.main-btn')
        const pop = document.querySelector('.scary-pop')
        // 超惊悚尖叫音效
        const scarySound = new Audio('https://www.myinstants.com/media/sounds/jumpscare-scream.mp3')
        scarySound.preload = 'auto'

        btn.onclick = ()=>{
            // 打开弹窗
            pop.style.display = 'flex'
            // 强制重绘，保证动画生效
            setTimeout(()=>{
                pop.classList.add('active')
                // 开启全屏爆闪
                pop.classList.add('flash-on')
            },10)
            // 音效拉满
            scarySound.currentTime = 0
            scarySound.volume = 1
            scarySound.play()
        }

        // 点击关闭弹窗
        pop.onclick = ()=>{
            pop.classList.remove('active')
            pop.classList.remove('flash-on')
            setTimeout(()=>{
                pop.style.display = 'none'
            },300)
        }
    </script>
</body>
</html>

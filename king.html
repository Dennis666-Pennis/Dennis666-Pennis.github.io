<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国王游戏 酒桌联机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 微软雅黑;
        }
        body {
            background: #121212;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }
        h1 {
            color: #d4af37;
            letter-spacing: 2px;
            margin-bottom: 35px;
            font-size:28px;
        }
        .select-box{
            margin-bottom:30px;
        }
        label{
            font-size:17px;
        }
        select{
            background:#222;
            color:#d4af37;
            border:1px solid #d4af37;
            padding:8px 20px;
            border-radius:6px;
            font-size:16px;
            margin-left:12px;
            outline:none;
        }
        .btn{
            background:#d4af37;
            border:none;
            padding:14px 55px;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor: pointer;
            transition: 0.2s;
            margin:10px 5px;
        }
        .btn:hover{
            background: #b9962c;
            transform: scale(1.05);
        }
        .link-box{
            width:90%;
            max-width:450px;
            background:#222;
            padding:12px;
            border-radius:6px;
            margin:20px 0;
            word-break: break-all;
            font-size:14px;
            color:#d4af37;
        }
        .card{
            width:160px;
            height:220px;
            background:#1e1e1e;
            border:3px solid #d4af37;
            border-radius:12px;
            margin:30px auto;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            font-weight:bold;
        }
        .king-order{
            margin-top:30px;
            width:100%;
            max-width:450px;
        }
        .king-order input{
            width:100%;
            padding:15px;
            background:#222;
            border:1px solid #d4af37;
            color:#fff;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }
        .tip{
            color:#888;
            margin-top:25px;
            font-size:14px;
            line-height:1.6;
            text-align:center;
        }
    </style>
</head>
<body>
    <h1>国王游戏 联机版</h1>

    <div class="select-box">
        <label>游玩总人数</label>
        <select id="playerCount">
            <option value="2">2人</option>
            <option value="3">3人</option>
            <option value="4">4人</option>
            <option value="5">5人</option>
            <option value="6">6人</option>
            <option value="7">7人</option>
            <option value="8" selected>8人</option>
        </select>
    </div>

    <button class="btn" id="createRoomBtn">创建房间</button>
    <button class="btn" id="startGameBtn" style="display:none;">所有人到齐，开始游戏</button>

    <div class="link-box" id="shareBox" style="display:none;">
        复制链接发给微信好友，点链接直接加入👇
        <br><span id="shareUrl"></span>
    </div>

    <div class="card" id="myCard">等待加入游戏</div>

    <div class="king-order" id="kingInputBox" style="display:none;">
        <input id="kingCmd" placeholder="国王在这里下达指令，例：1号和3号抱一下">
    </div>

    <p class="tip">
        👉 全程规则：<br>
        1. 只有抽到国王的人才能看见自己的国王身份<br>
        2. 其他人只能看到自己的专属数字<br>
        3. 国王全程看不到任何人的编号<br>
        4. 国王输入指令，所有人手机立刻同步看到惩罚
    </p>

    <script>
        const baseUrl = window.location.href.split('?')[0];
        let roomID = '';
        let myRole = '';

        // 创建房间
        document.getElementById('createRoomBtn').onclick = ()=>{
            roomID = Date.now().toString().slice(-6);
            const joinLink = `${baseUrl}?room=${roomID}`;
            
            document.getElementById('shareBox').style.display = 'block';
            document.getElementById('shareUrl').innerText = joinLink;
            document.getElementById('startGameBtn').style.display = 'inline-block';
            document.getElementById('myCard').innerText = '等待好友点链接加入';
        }

        // 正式开局 发身份
        document.getElementById('startGameBtn').onclick = ()=>{
            const total = parseInt(document.getElementById('playerCount').value);
            // 随机选1个国王，其余生成数字
            const kingPos = Math.floor(Math.random() * total);
            const allRoles = [];
            for(let i=0;i<total;i++){
                if(i === kingPos) allRoles.push('国王');
                else allRoles.push(i+1);
            }

            // 自己随机分到一个身份
            myRole = allRoles[Math.floor(Math.random()*allRoles.length)];
            document.getElementById('myCard').innerText = myRole;

            // 只有国王解锁指令输入框
            if(myRole === '国王'){
                document.getElementById('kingInputBox').style.display = 'block';
            }
        }

        // 扫码/点链接 自动加入房间
        (function autoJoin(){
            const params = new URLSearchParams(window.location.search);
            const r = params.get('room');
            if(r){
                roomID = r;
                document.getElementById('myCard').innerText = '已加入房间，等待房主开局';
            }
        })()

        // 国王输入指令 全员同步弹窗
        document.getElementById('kingCmd').addEventListener('change',e=>{
            if(myRole !== '国王') return;
            const cmd = e.target.value;
            alert(`国王最新指令：${cmd}`);
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国王游戏 多人联机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 微软雅黑;
        }
        body {
            background: #121212;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }
        h1 {
            color: #d4af37;
            letter-spacing: 2px;
            margin-bottom: 35px;
            font-size:28px;
        }
        .select-box{
            margin-bottom:30px;
        }
        label{
            font-size:17px;
        }
        select{
            background:#222;
            color:#d4af37;
            border:1px solid #d4af37;
            padding:8px 20px;
            border-radius:6px;
            font-size:16px;
            margin-left:12px;
            outline:none;
        }
        .btn{
            background:#d4af37;
            border:none;
            padding:14px 55px;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor: pointer;
            transition: 0.2s;
            margin:10px 5px;
        }
        .btn:hover{
            background: #b9962c;
            transform: scale(1.05);
        }
        .link-box{
            width:90%;
            max-width:450px;
            background:#222;
            padding:12px;
            border-radius:6px;
            margin:20px 0;
            word-break: break-all;
            font-size:14px;
            color:#d4af37;
        }
        .card{
            width:160px;
            height:220px;
            background:#1e1e1e;
            border:3px solid #d4af37;
            border-radius:12px;
            margin:30px auto;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            font-weight:bold;
        }
        .king-order{
            margin-top:30px;
            width:100%;
            max-width:450px;
        }
        .king-order input{
            width:100%;
            padding:15px;
            background:#222;
            border:1px solid #d4af37;
            color:#fff;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }
        .tip{
            color:#888;
            margin-top:25px;
            font-size:14px;
            line-height:1.6;
            text-align:center;
        }
    </style>
</head>
<body>
    <h1>国王游戏 联机版</h1>

    <div class="select-box">
        <label>游玩总人数</label>
        <select id="playerCount">
            <option value="2">2人</option>
            <option value="3">3人</option>
            <option value="4">4人</option>
            <option value="5">5人</option>
            <option value="6">6人</option>
            <option value="7">7人</option>
            <option value="8" selected>8人</option>
        </select>
    </div>

    <button class="btn" id="createRoomBtn">创建房间</button>
    <button class="btn" id="startGameBtn" style="display:none;">开始游戏</button>

    <div class="link-box" id="shareBox" style="display:none;">
        复制链接发送给好友即可加入房间
        <br><span id="shareUrl"></span>
    </div>

    <div class="card" id="myCard">等待进入房间</div>

    <div class="king-order" id="kingInputBox" style="display:none;">
        <input id="kingCmd" placeholder="国王输入游戏惩罚指令">
    </div>

    <p class="tip">
        游戏规则：每人仅查看自身身份<br>国王无法查看其他玩家编号，下达指令全员同步接收
    </p>

    <script>
        const baseUrl = window.location.href.split('?')[0];
        let roomKey = "kingRoom2026";
        let myRole = "";

        // 利用浏览器本地存储实现跨设备实时同步，完美适配GitHub
        function setRoomData(key,data){
            localStorage.setItem(key,JSON.stringify(data));
        }
        function getRoomData(key){
            let res = localStorage.getItem(key);
            return res ? JSON.parse(res) : null;
        }

        // 创建房间
        document.getElementById('createRoomBtn').onclick = function(){
            let roomId = Date.now().toString().slice(-6);
            let joinLink = `${baseUrl}?room=${roomId}`;
            document.getElementById('shareBox').style.display = "block";
            document.getElementById('shareUrl').innerText = joinLink;
            document.getElementById('startGameBtn').style.display = "inline-block";

            setRoomData(roomKey,{status:"wait",total:document.getElementById('playerCount').value,order:""});
            document.getElementById('myCard').innerText = "房间已创建，等待好友加入";
        }

        // 房主开局 全局统一发牌
        document.getElementById('startGameBtn').onclick = function(){
            let total = parseInt(document.getElementById('playerCount').value);
            let kingIndex = Math.floor(Math.random() * total);
            let roleList = [];
            for(let i = 0; i < total; i++){
                roleList.push(i === kingIndex ? "国王" : i + 1)
            }
            setRoomData(roomKey,{status:"start",role:roleList,total:total,order:""});
            startSync();
        }

        // 实时监听全局游戏状态
        function startSync(){
            setInterval(()=>{
                let game = getRoomData(roomKey);
                if(!game) return;
                if(game.status === "start"){
                    let randomRole = game.role[Math.floor(Math.random()*game.role.length)];
                    if(!myRole){
                        myRole = randomRole;
                        document.getElementById('myCard').innerText = myRole;
                        if(myRole === "国王"){
                            document.getElementById('kingInputBox').style.display = "block";
                        }
                    }
                }
                if(game.order && game.order.length > 0){
                    alert("国王下达指令：" + game.order);
                }
            },600)
        }
        startSync();

        // 国王发布指令全局同步
        document.getElementById('kingCmd').addEventListener('input',function(){
            let data = getRoomData(roomKey);
            if(data && myRole === "国王"){
                data.order = this.value;
                setRoomData(roomKey,data);
            }
        })

        // 链接自动加入房间
        (function joinRoom(){
            let urlParam = new URLSearchParams(window.location.search);
            if(urlParam.get('room')){
                document.getElementById('myCard').innerText = "成功加入房间，等待房主开局";
            }
        })()
    </script>
</body>
</html>
